name:       WF_DEL_WORKFLOWS
run-name:   WF_DEL_WORKFLOWS BY ${{ github.actor }}
on:
 workflow_dispatch:

permissions:
  contents: write
  actions:  write
   
jobs:
# :::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::
 JOB_ENV:
  runs-on: ubuntu-latest
  steps:
#######################################################################
#   STEP:                                              [ 2026_04_23 ] #      
  - name: DEL_WORKFLOWS
#######################################################################
    id:   DEL_WORKFLOWS
    env:
     GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    shell: bash 
    run: |
     WORKFLOW_RUN_IDS=$(gh api --paginate /repos/${GITHUB_REPOSITORY}/actions/runs | jq -r '.workflow_runs[].id')     
     for id in $WORKFLOW_RUN_IDS
     do
      if [[ "$GITHUB_RUN_ID" != "$id" ]]
      then
       echo delete $id
       gh api -X DELETE /repos/${GITHUB_REPOSITORY}/actions/runs/$id || true
      else
       echo skip current $id
      fi
     done
#   STEP [END] ########################################################
#   JOB  [END] ::::::::::::::::::::::::::::::::::::::::::::::::::::::::
